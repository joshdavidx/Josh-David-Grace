name: Compilar Josh David Grace (Windows)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar
        run: cmake -B build

      - name: Compilar
        run: cmake --build build --config Release --parallel

      - name: Empaquetar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Get-ChildItem -Directory "build/*_artefacts/Release/VST3/*.vst3" | ForEach-Object { Copy-Item -Recurse $_.FullName "dist/$($_.Name)" }
          Copy-Item "installer/Instalar.bat" "dist/Instalar.bat"

      - name: Subir resultado
        uses: actions/upload-artifact@v4
        with:
          name: JoshDavidGrace-Windows
          path: dist
